<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#E2E6ED" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Frontier Week" />
  <title>London Frontier Week</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#schedule" aria-label="London Frontier Week, home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">
          <span class="brand-title"><span class="long">London </span>Frontier Week</span>
          <span class="brand-sub" id="brandSub">11–13 November 2026</span>
        </span>
      </a>

      <nav class="nav" aria-label="Sections">
        <a class="nav-link" data-tab="schedule" href="#schedule">Schedule</a>
        <a class="nav-link" data-tab="board" href="#board">Who’s where</a>
        <a class="nav-link" data-tab="people" href="#people">People</a>
        <a class="nav-link" data-tab="meet" href="#meet"><span class="nav-full">Who you’ll meet</span><span class="nav-short">Meet</span></a>
        <a class="nav-link" data-tab="logistics" href="#logistics">Travel<span class="nav-full"> &amp; stays</span></a>
        <a class="nav-link" data-tab="issues" href="#issues">Open items</a>
      </nav>

      <div class="topbar-actions">
        <span class="status static" id="status" title="Read-only copy"><i></i><span>Read-only</span></span>
        <button class="editbtn" id="editBtn" type="button" aria-pressed="false" hidden></button>
        <button class="viewer" id="viewerBtn" type="button" aria-haspopup="dialog">
          <span class="viewer-avatar" id="viewerAvatar" aria-hidden="true">All</span>
          <span class="viewer-text"><span class="viewer-label">Viewing as</span><span class="viewer-name" id="viewerName">Everyone</span></span>
          <svg class="viewer-caret" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="iconbtn" id="aboutBtn" type="button" aria-label="About this schedule">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v6M12 7.5v.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="daybar" id="daybar" role="tablist" aria-label="Day"></div>

  <main id="main" class="content" tabindex="-1"></main>

  <nav class="bottomnav" aria-label="Sections">
    <a class="bn-item" data-tab="schedule" href="#schedule">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Schedule</span>
    </a>
    <a class="bn-item" data-tab="board" href="#board">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h7M4 12h11M4 17h5M14 7h6M18 12h2M12 17h8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span>Who’s where</span>
    </a>
    <a class="bn-item" data-tab="people" href="#people">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.5" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M15.5 5.5a3 3 0 0 1 0 6M17 13.8c2.4.5 4 2.4 4 5.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>People</span>
    </a>
    <a class="bn-item" data-tab="meet" href="#meet">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="11" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5.8 16.5c.5-1.6 1.7-2.5 3.2-2.5s2.7.9 3.2 2.5M14.5 10h3M14.5 13.5h3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Meet</span>
    </a>
    <a class="bn-item" data-tab="logistics" href="#logistics">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s6-5.2 6-10.5A6 6 0 0 0 6 10.5C6 15.8 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="10.5" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      <span>Travel</span>
    </a>
    <a class="bn-item" data-tab="issues" href="#issues">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l9 16H3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 10v4.5M12 17.2v.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Open items</span>
      <em class="bn-badge" id="issuesBadge" hidden></em>
    </a>
  </nav>

  <div class="sheet-root" id="sheetRoot" hidden>
    <div class="sheet-backdrop" id="sheetBackdrop"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-handle" aria-hidden="true"></div>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <div class="sheet-body" id="sheetBody"></div>
    </section>
  </div>

  <script src="data.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
